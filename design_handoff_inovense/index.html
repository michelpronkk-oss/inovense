<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inovense OS — The operating layer for AI-native work</title>
<link rel="icon" type="image/svg+xml" href="assets/inovense-favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="styles-layered-stack.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/header.jsx"></script>
<script type="text/babel" src="src/hero-v5.jsx"></script>
<script type="text/babel" src="src/dashboard.jsx"></script>
<script type="text/babel" src="src/sections-product.jsx"></script>
<script type="text/babel" src="src/sections-trust.jsx"></script>
<script type="text/babel">
const { useState: useStateHome } = React;

// ============================================================
// Announcement bar (Runlayer-style credibility band)
// ============================================================
const AnnouncementBar = () => {
  const [open, setOpen] = useStateHome(true);
  if (!open) return null;
  return (
    <div className="ann-bar" role="banner">
      <span className="ann-tag">Series A</span>
      <span className="ann-text">
        <strong>Inovense raises $24M</strong> to build the operating layer for AI-native businesses.
      </span>
      <a href="#press" className="ann-link">Read announcement <I.arrow size={11} /></a>
      <button className="ann-close" onClick={() => setOpen(false)} aria-label="Dismiss"><I.x size={12} /></button>
    </div>
  );
};

// ============================================================
// Integrations band — replaces fake customer logos
// Tools you actually integrate with (honest, recognizable, credible)
// ============================================================
const ToolMark = ({ name, children }) => (
  <span className="tib-item" title={name}>
    <span className="tib-mark">{children}</span>
    <span className="tib-name">{name}</span>
  </span>
);

const IntegrationsBand = () => (
  <section className="tib">
    <div className="container">
      <p className="tib-label">Built to run on the stack you already operate</p>
      <div className="tib-row">
        <ToolMark name="Slack">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="10" width="8" height="4" rx="2" fill="#36C5F0" />
            <rect x="13" y="10" width="8" height="4" rx="2" fill="#2EB67D" />
            <rect x="10" y="3" width="4" height="8" rx="2" fill="#ECB22E" />
            <rect x="10" y="13" width="4" height="8" rx="2" fill="#E01E5A" />
          </svg>
        </ToolMark>
        <ToolMark name="Notion">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ECEFF3"><path d="M5 4h10l4 4v12H5V4z" fillOpacity="0.05" stroke="#ECEFF3" strokeWidth="1.4"/><path d="M8 9v8M8 9l8 8M16 9v8" stroke="#ECEFF3" strokeWidth="1.4" fill="none" strokeLinecap="round"/></svg>
        </ToolMark>
        <ToolMark name="Stripe">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="4" fill="#635BFF"/><path d="M10 9c0-.6.5-.9 1.3-.9 1.1 0 2.5.3 3.6.9V6c-1.2-.5-2.4-.7-3.6-.7-3 0-4.9 1.5-4.9 4.1 0 4 5.4 3.4 5.4 5.1 0 .7-.6 1-1.5 1-1.3 0-2.9-.5-4.1-1.2v3.2c1.4.6 2.8.8 4.1.8 3 0 5.1-1.5 5.1-4.1.1-4.3-5.4-3.6-5.4-5.2z" fill="#fff"/></svg>
        </ToolMark>
        <ToolMark name="HubSpot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="3" stroke="#FF7A59" strokeWidth="1.6"/><circle cx="12" cy="18" r="2.5" stroke="#FF7A59" strokeWidth="1.6"/><path d="M12 13v2.5M18 4l-3 3.5M21 6h-3M21 6v3" stroke="#FF7A59" strokeWidth="1.4" strokeLinecap="round"/></svg>
        </ToolMark>
        <ToolMark name="Linear">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill="#5E6AD2"/><path d="M5 14l5 5M5 10l9 9M6 6l13 13M10 5l9 9M14 5l5 5" stroke="#fff" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </ToolMark>
        <ToolMark name="Gmail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="#EA4335" strokeWidth="1.5"/><path d="M4 8l8 6 8-6" stroke="#EA4335" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>
        </ToolMark>
        <ToolMark name="Salesforce">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 16c-2 0-3.5-1.6-3.5-3.5 0-1.4.8-2.6 2-3.1 0-2.7 2.2-4.9 4.9-4.9 1.5 0 2.9.7 3.8 1.8.7-.6 1.7-1 2.7-1 2.3 0 4.1 1.8 4.1 4.1 0 .4-.1.8-.2 1.2.7.6 1.2 1.5 1.2 2.6 0 1.9-1.5 3.4-3.4 3.4H7z" fill="#00A1E0"/></svg>
        </ToolMark>
        <ToolMark name="Intercom">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill="#1F8DED"/><path d="M7 9v6M10 8v8M13 8v8M16 9v6M7 17.5c2 .8 4 1.5 5 1.5s3-.7 5-1.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
        </ToolMark>
      </div>
      <p className="tib-foot">
        <span className="tib-foot-num">80+</span> first-party connectors ·
        <span className="tib-foot-acc"> custom SDK</span> in TypeScript &amp; Python
      </p>
    </div>
  </section>
);

// ============================================================
// Stats strip — quick credibility metric row
// ============================================================
const StatsStrip = () => (
  <section className="stats-strip">
    <div className="container">
      <div className="stats-row">
        {[
          { val: "1.2M", lab: "agent actions per month" },
          { val: "94%", lab: "approval rate" },
          { val: "412h", lab: "saved per workspace / wk" },
          { val: "8.4k", lab: "audit events / day" },
        ].map((s) => (
          <div className="stat-cell" key={s.lab}>
            <div className="stat-val">{s.val}</div>
            <div className="stat-lab">{s.lab}</div>
          </div>
        ))}
      </div>
    </div>
  </section>
);

// ============================================================
// Footer
// ============================================================
const Footer = () => {
  const cols = [
    { title: "Platform",  links: ["Overview", "AI Agents", "Workflows", "Memory & context", "Approvals", "Integrations", "Security"] },
    { title: "Solutions", links: ["Revenue teams", "Marketing", "Client services", "Operations", "Founders & ops"] },
    { title: "Resources", links: ["Documentation", "API reference", "Changelog", "Status", "System architecture", "Trust center"] },
    { title: "Company",   links: ["About", "Careers", "Customers", "Press", "Contact"] },
  ];
  return (
    <footer className="footer">
      <div className="container-wide">
        <div className="ft-top">
          <div className="ft-brand">
            <Brand />
            <p style={{ marginTop: 18, maxWidth: 320, fontSize: 14, color: "var(--text-mute)" }}>
              The operating layer for AI-native work. Built for serious operators.
            </p>
            <div className="ft-status">
              <span className="dot dot-green" />
              <span>All systems operational</span>
              <span style={{ color: "var(--text-faint)" }}>·</span>
              <span>v1.18.2</span>
            </div>
          </div>
          <div className="ft-cols">
            {cols.map((c) => (
              <div key={c.title} className="ft-col">
                <div className="label" style={{ marginBottom: 14 }}>{c.title}</div>
                <ul>{c.links.map((l) => <li key={l}><a href="#">{l}</a></li>)}</ul>
              </div>
            ))}
          </div>
        </div>
        <div className="ft-bot">
          <span>© 2026 Inovense, Inc. All rights reserved.</span>
          <div className="ft-bot-links">
            <a href="#">Terms</a><a href="#">Privacy</a><a href="#">Security</a><a href="#">Cookies</a>
          </div>
        </div>
      </div>
      <style>{`
        .ft-top { display: grid; grid-template-columns: 1.2fr 2.4fr; gap: 60px; padding-bottom: 56px; border-bottom: 1px solid var(--line); }
        .ft-status { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 6px 12px; background: rgba(255,255,255,0.02); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
        .ft-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        .ft-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .ft-col a { color: var(--text-dim); font-size: 13.5px; transition: color .15s ease; }
        .ft-col a:hover { color: var(--cyan); }
        .ft-bot { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-top: 28px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-mute); }
        .ft-bot-links { display: flex; gap: 20px; }
        .ft-bot-links a:hover { color: var(--cyan); }
        @media (max-width: 1000px) {
          .ft-top { grid-template-columns: 1fr; gap: 40px; }
          .ft-cols { grid-template-columns: 1fr 1fr; gap: 30px; }
          .ft-bot { flex-direction: column; align-items: flex-start; }
        }
      `}</style>
    </footer>
  );
};

const App = () => (
  <>
    <Header />
    <main>
      <HeroV5 />
      <IntegrationsBand />
      <OperatingLayerSection />
      <StatsStrip />
      <AgentsSection />
      <WorkflowsSection />
      <MemorySection />
      <ApprovalsSection />
      <IntegrationsSection />
      <SecuritySection />
      <PricingSection />
      <FinalCTA />
    </main>
    <Footer />
  </>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
